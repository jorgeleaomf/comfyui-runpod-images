# =============================================================================
# Build das imagens ComfyUI prontas para RunPod e publicacao no GHCR.
# Roda nos servidores do GitHub (nada na maquina do usuario, sem Docker local).
# A autenticacao usa o GITHUB_TOKEN do proprio repositorio: nenhum segredo
# precisa ser cadastrado.
#
# Para reconstruir: aba Actions -> "construir imagens" -> Run workflow.
# A tag ":latest" aponta para a ultima construcao bem-sucedida e uma tag com a
# data (AAAAMMDD) guarda a versao daquele dia.
# =============================================================================
name: construir imagens

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "workflows/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      familia:
        description: "qual familia construir (ou 'todas')"
        default: "todas"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.montar.outputs.lista }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: montar
        name: descobre as familias (uma pasta por imagem)
        env:
          EVENTO: ${{ github.event_name }}
          PEDIDA: ${{ github.event.inputs.familia }}
          ANTES: ${{ github.event.before }}
          DEPOIS: ${{ github.sha }}
        run: |
          TODAS=$(ls -d docker/*/ | xargs -n1 basename | sort | paste -sd, -)
          if [ "$EVENTO" = "workflow_dispatch" ] && [ -n "$PEDIDA" ] && [ "$PEDIDA" != "todas" ]; then
            echo "pedido manual: $PEDIDA"
            echo "lista=[\"$PEDIDA\"]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # num push, constroi SO as familias cujos arquivos mudaram - assim mexer
          # numa imagem nao obriga a reconstruir (e rebaixar) as outras.
          MUDOU=""
          if [ -n "$ANTES" ] && [ "$ANTES" != "0000000000000000000000000000000000000000" ]; then
            MUDOU=$(git diff --name-only "$ANTES" "$DEPOIS" -- docker workflows 2>/dev/null || true)
          fi
          if [ -z "$MUDOU" ]; then
            echo "nenhuma mudanca em docker/ ou workflows/ - nada a construir"
            echo "lista=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "arquivos que mudaram:"; echo "$MUDOU"
          LISTA=""
          for f in $(echo "$TODAS" | tr ',' ' '); do
            if [ ! -f "docker/$f/Dockerfile" ]; then
              echo "familia $f sem Dockerfile - ignorada"
              continue
            fi
            if echo "$MUDOU" | grep -q "^docker/$f/"; then
              LISTA="$LISTA\"$f\","; continue
            fi
            if echo "$MUDOU" | grep -q "^workflows/$f-"; then
              LISTA="$LISTA\"$f\","; continue
            fi
          done
          LISTA="[${LISTA%,}]"
          echo "familias a construir: $LISTA"
          echo "lista=$LISTA" >> "$GITHUB_OUTPUT"

  construir:
    needs: preparar
    # sem familia para construir, nao roda (lista vazia nao pode virar matriz)
    if: needs.preparar.outputs.lista != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        familia: ${{ fromJson(needs.preparar.outputs.lista) }}
    steps:
      - uses: actions/checkout@v4

      - name: liberar espaco em disco no runner
        run: |
          echo "== ANTES =="; df -h / | tail -1
          # tira tudo que o build nao usa (o LTX precisa de ~50 GB livres)
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" \
                      /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/mono \
                      /opt/microsoft /usr/local/lib/node_modules /usr/share/miniconda \
                      /usr/local/share/chromium /opt/google /usr/local/.ghcup /usr/share/java \
                      /usr/lib/jvm /usr/share/gradle /usr/share/kotlin || true
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          docker image prune -a -f || true
          echo "== DEPOIS =="; df -h / | tail -1
          echo "espaco livre em GB: $(df -BG --output=avail / | tail -1 | tr -dc '0-9')"

      - uses: docker/setup-buildx-action@v3

      - name: entrar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: data da construcao
        id: data
        run: echo "valor=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.familia }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/comfyui-${{ matrix.familia }}:latest
            ghcr.io/${{ github.repository_owner }}/comfyui-${{ matrix.familia }}:${{ steps.data.outputs.valor }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/comfyui-${{ matrix.familia }}:latest
          cache-to: type=inline
          provenance: true

      - name: resumo
        run: |
          {
            echo "### imagem construida: comfyui-${{ matrix.familia }}"
            echo ""
            echo "- tag: \`ghcr.io/${{ github.repository_owner }}/comfyui-${{ matrix.familia }}:latest\`"
            echo "- tag com data: \`${{ steps.data.outputs.valor }}\`"
            echo "- origem do codigo: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
